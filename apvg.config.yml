project:
  name: My Web App
  description: A sample web application
source:
  repository: https://github.com/your-org/your-repo.git
  installDeps: false
  platformPriority:
    - web
    - cli
    - android
    - flutter
    - react-native
    - unity
    - ios
    - desktop
    - other
  exclude: []
  startCommand: npm run dev
target:
  url: http://localhost:3000
  autoDetectUrl: false
  type: web
  cli:
    image: apvg-cli-recorder:latest
    shell: /bin/bash
    columns: 100
    rows: 30
    fontSize: 22
    allowedCommands: []
    deniedCommandPatterns:
      - publish
      - login
      - logout
      - token
      - secret
      - clean
      - remove
      - delete
      - serve
      - start
      - watch
      - generate
      - voice
      - record
      - render
video:
  type: demo
  duration: 60
  resolution: 1920x1080
  fps: 30
  language: ja
  pageReadyWaitSeconds: 2
  sceneGapSeconds: 1
llm:
  provider: ollama
  model: qwen2.5:7b-instruct
  ollamaHost: http://localhost:11434
voicevox:
  host: http://localhost:50021
  speakerId: 3
output:
  dir: ./output
  workDir: ./.apvg
