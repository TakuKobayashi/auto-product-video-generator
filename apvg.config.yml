project:
  name: auto-product-video-generator
  description: ''
source:
  localPath: ./
  installDeps: false
  # environmentFile: /path/to/project.env
  platformPriority:
    - web
    - cli
    - android
    - flutter
    - react-native
    - unity
    - ios
    - desktop
    - other
  exclude: []
target:
  url: http://localhost:3000
  autoDetectUrl: true
  type: cli
  cli:
    image: apvg-cli-recorder:latest
    shell: /bin/bash
    columns: 100
    rows: 30
    fontSize: 22
    allowedCommands: []
    deniedCommandPatterns:
      - publish
      - login
      - logout
      - token
      - secret
      - clean
      - remove
      - delete
      - serve
      - start
      - watch
      - generate
      - voice
      - record
      - render
video:
  type: demo
  duration: 60
  resolution: 1920x1080
  fps: 30
  language: ja
  singleLineSubtitles: true
  pageReadyWaitSeconds: 2
  sceneGapSeconds: 1
llm:
  provider: ollama
  model: qwen2.5:7b-instruct
  ollamaHost: http://127.0.0.1:11434
voice:
  # Every string in this YAML supports ${ANY_ENV_KEY}. A .env beside this file
  # is loaded automatically. Set envFile to use another file as well.
  # envFile: ./.env.local
  profiles:
    - name: narrator-1
      type: voicevox
      url: http://localhost:50021
      speakerId: 1
    - name: narrator-2
      type: voicevox
      url: http://localhost:50021
      speakerId: 2
    # AITalk 5 WebAPI can be mixed with VOICEVOX. Credentials are read from
    # AITALK_USERNAME and AITALK_PASSWORD by default.
    # - name: narrator-aitalk
    #   type: aitalk
    #   url: https://webapi.aitalk.jp/webapi/v5/ttsget.php
    #   speakerName: nozomi
    #   username: ${AITALK_USERNAME}
    #   password: ${AITALK_PASSWORD}
output:
  dir: ./output
  workDir: ./.apvg
