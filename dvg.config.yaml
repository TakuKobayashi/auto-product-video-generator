project:
  name: auto-product-video-generator
  description: ""
source:
  repository: https://github.com/TakuKobayashi/tappunpages.git
  installDeps: false
  startCommand: npm run dev
target:
  url: http://localhost:3000
  type: web
video:
  type: demo
  duration: 60
  resolution: 1920x1080
  fps: 30
  language: ja
  audience: ITに詳しくない一般の視聴者。製品で何ができ、どう使うかを知りたい人
  sceneGapSeconds: 1
llm:
  provider: ollama
  model: qwen2.5:7b-instruct
  ollamaHost: http://127.0.0.1:11434
voicevox:
  host: http://localhost:50021
  speakerId: 3
output:
  dir: ./output
  workDir: ./.dvg
