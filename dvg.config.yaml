project:
  name: auto-product-video-generator
  description: ""
source:
  repository: https://github.com/TakuKobayashi/fullstack-media-converter.git
  installDeps: false
  startCommand: pnpm run dev
  platformPriority:
    - web
    - android
    - flutter
    - react-native
    - unity
    - ios
    - desktop
    - other
target:
  url: http://localhost:3000
  autoDetectUrl: false
  type: web
video:
  type: demo
  duration: 60
  resolution: 1920x1080
  fps: 30
  language: ja
  pageReadyWaitSeconds: 2
  sceneGapSeconds: 1
llm:
  provider: ollama
  model: qwen2.5:7b-instruct
  ollamaHost: http://127.0.0.1:11434
voicevox:
  host: http://localhost:50021
  speakerId: 3
output:
  dir: ./output
  workDir: ./.dvg
