name: Publish packages to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) {
            throw new Error(`Invalid release tag: ${process.env.RELEASE_VERSION}`);
          }
          const expected = process.env.RELEASE_VERSION.replace(/^v/, '');
          const packageDirectories = fs.readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join('packages', entry.name, 'package.json'))
            .filter(fs.existsSync);

          const mismatches = packageDirectories.flatMap((packageFile) => {
            const packageJson = JSON.parse(fs.readFileSync(packageFile, 'utf8'));
            return packageJson.version === expected
              ? []
              : [`${packageJson.name}: ${packageJson.version} (expected ${expected})`];
          });

          if (mismatches.length > 0) {
            throw new Error(`Tag and package versions do not match:\n${mismatches.join('\n')}`);
          }
          NODE

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish packages
        run: pnpm publish --recursive --access public --no-git-checks --provenance --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
