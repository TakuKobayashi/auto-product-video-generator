name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run test CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish CLI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) {
            throw new Error(`Invalid release tag: ${process.env.RELEASE_VERSION}`);
          }
          const expected = process.env.RELEASE_VERSION.replace(/^v/, '');
          const packageJson = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          if (packageJson.version !== expected) {
            throw new Error(
              `Tag ${process.env.RELEASE_VERSION} does not match ${packageJson.name}@${packageJson.version}`,
            );
          }
          NODE

      - name: Build
        run: pnpm build

      - name: Verify npm authentication
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "GitHub OIDC is unavailable; check the id-token: write permission." >&2
            exit 1
          }
          test -z "${NODE_AUTH_TOKEN:-}" || {
            echo "NODE_AUTH_TOKEN must not be set when using trusted publishing." >&2
            exit 1
          }
          npm --version

      - name: Publish CLI
        working-directory: packages/cli
        run: npm publish --registry https://registry.npmjs.org --access public --tag "$NPM_DIST_TAG" --loglevel verbose
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}

      - name: Collect npm publish diagnostics
        if: failure()
        run: |
          diagnostics="$RUNNER_TEMP/npm-publish-diagnostics"
          mkdir -p "$diagnostics/npm-logs"

          npm --version > "$diagnostics/npm-version.txt"
          node --version > "$diagnostics/node-version.txt"
          npm config get registry > "$diagnostics/registry.txt"

          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF}"
            echo "ref=${GITHUB_REF}"
            echo "runner_environment=${RUNNER_ENVIRONMENT}"
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "oidc_request_url=present"
            else
              echo "oidc_request_url=missing"
            fi
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "oidc_request_token=present"
            else
              echo "oidc_request_token=missing"
            fi
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              echo "node_auth_token=present"
            else
              echo "node_auth_token=missing"
            fi
          } > "$diagnostics/environment.txt"

          if [ -d "$HOME/.npm/_logs" ]; then
            cp -R "$HOME/.npm/_logs/." "$diagnostics/npm-logs/"
          fi

      - name: Upload npm publish diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-publish-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/npm-publish-diagnostics/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create AI-generated release notes
        id: release-notes
        uses: ./.github/actions/ai-release-notes
        with:
          github-token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          model: qwen2.5-coder:7b-instruct
          language: jp
