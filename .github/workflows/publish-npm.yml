name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run test CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish CLI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) {
            throw new Error(`Invalid release tag: ${process.env.RELEASE_VERSION}`);
          }
          const expected = process.env.RELEASE_VERSION.replace(/^v/, '');
          const packageJson = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          if (packageJson.version !== expected) {
            throw new Error(
              `Tag ${process.env.RELEASE_VERSION} does not match ${packageJson.name}@${packageJson.version}`,
            );
          }
          NODE

      - name: Build
        run: pnpm build

      - name: Publish CLI
        working-directory: packages/cli
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
