name: Test Marketplace action

on:
  push:
    branches:
      - generate-video
  workflow_dispatch:
    inputs:
      repository:
        description: Git repository URL to analyze; empty uses this repository
        required: false
        type: string
        default: ''
      ref:
        description: Branch, tag, or commit of the target repository
        required: false
        type: string
        default: ''
      project-path:
        description: Unity/application path inside a monorepo; normally auto-detected
        required: false
        type: string
        default: ''
      target-env-base64:
        description: Base64-encoded complete .env for this recording (leave empty if not needed)
        required: false
        type: string
        default: ''
      apvg-version:
        description: Published APVG npm version used by the Marketplace action
        required: false
        type: string
        default: latest
      unity-hub-version:
        description: Unity Hub version used to install the Unity Editor
        required: false
        type: string
        default: '3.21.1'
      unity-version:
        description: Unity Editor override; versions before 2022.2 use the latest stable release
        required: false
        type: string
        default: ''
      cache-enabled:
        description: Cache Android SDK/emulator, Unity Editor, Unity Hub, Ollama models, and Playwright Chromium
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: generate-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate video on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out action repository
        uses: actions/checkout@v6

      - name: Configure repository SSH key
        env:
          REPOSITORY: ${{ inputs.repository || '' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [[ "$REPOSITORY" == ssh://* || "$REPOSITORY" =~ ^[^/@:]+@[^/:]+: ]] || exit 0
          [[ -n "$SSH_KEY" ]] || {
            echo "::error::SSH_KEY secret is required for an SSH repository URL"
            exit 1
          }
          ssh_auth_sock="$RUNNER_TEMP/apvg-ssh-agent.sock"
          ssh-agent -a "$ssh_auth_sock" >/dev/null
          SSH_AUTH_SOCK="$ssh_auth_sock" ssh-add - <<< "$SSH_KEY"
          echo "SSH_AUTH_SOCK=$ssh_auth_sock" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      # Unity-specific installation, licensing, Xvfb, and WebM-to-MP4
      # conversion run conditionally inside action.yml after project analysis.
      - name: Prepare target environment file
        if: github.event_name == 'workflow_dispatch'
        id: target-env
        run: |
          TARGET_ENV_BASE64="$(jq -r '.inputs["target-env-base64"] // empty' "$GITHUB_EVENT_PATH")"
          [[ -n "$TARGET_ENV_BASE64" ]] || exit 0
          echo '::add-mask::'"$TARGET_ENV_BASE64"
          umask 077
          mkdir -p "$RUNNER_TEMP/apvg-target-env"
          env_file="$RUNNER_TEMP/apvg-target-env/.env"
          if ! printf '%s' "$TARGET_ENV_BASE64" | base64 --decode > "$env_file"; then
            rm -f -- "$env_file"
            echo '::error::The target environment input is not valid Base64'
            exit 1
          fi
          echo "path=$env_file" >> "$GITHUB_OUTPUT"

      - name: Generate promotional video
        id: apvg
        uses: ./
        with:
          apvg-version: ${{ inputs.apvg-version || 'latest' }}
          repository: ${{ inputs.repository || '' }}
          ref: ${{ inputs.ref || '' }}
          project-path: ${{ inputs.project-path || '' }}
          environment-file: ${{ steps.target-env.outputs.path }}
          video-type: demo
          ollama-model: qwen2.5:7b-instruct
          output-directory: apvg-output
          export-remotion: 'true'
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          unity-hub-version: ${{ inputs['unity-hub-version'] }}
          unity-version: ${{ inputs['unity-version'] }}
          cache-enabled: ${{ github.event_name != 'workflow_dispatch' || inputs['cache-enabled'] }}

      - name: Upload final video, Remotion project, and intermediate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: promotional-video-${{ github.run_number }}
          path: ${{ steps.apvg.outputs['artifacts-path'] }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary target environment file
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/apvg-target-env/.env"
          rmdir -- "$RUNNER_TEMP/apvg-target-env" 2>/dev/null || true
