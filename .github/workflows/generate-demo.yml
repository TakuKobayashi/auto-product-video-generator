name: Test Marketplace action

on:
  push:
    branches:
      - generate-video
  workflow_dispatch:
    inputs:
      repository:
        description: Git repository URL to analyze; empty uses this repository
        required: false
        type: string
        default: ''
      ref:
        description: Branch, tag, or commit of the target repository
        required: false
        type: string
        default: ''
      project-path:
        description: Unity/application path inside a monorepo; normally auto-detected
        required: false
        type: string
        default: ''
      apvg-version:
        description: Published APVG npm version used by the Marketplace action
        required: false
        type: string
        default: latest
      unity-hub-version:
        description: Unity Hub version used to install the Unity Editor
        required: false
        type: string
        default: '3.21.1'

permissions:
  contents: read

concurrency:
  group: generate-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate video on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out action repository
        uses: actions/checkout@v6

      # Unity-specific installation, licensing, Xvfb, and WebM-to-MP4
      # conversion run conditionally inside action.yml after project analysis.
      - name: Generate promotional video
        id: apvg
        uses: ./
        with:
          apvg-version: ${{ inputs.apvg-version || 'latest' }}
          repository: ${{ inputs.repository || '' }}
          ref: ${{ inputs.ref || '' }}
          project-path: ${{ inputs.project-path || '' }}
          video-type: demo
          ollama-model: qwen2.5:7b-instruct
          output-directory: apvg-output
          export-remotion: 'true'
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          unity-hub-version: ${{ inputs['unity-hub-version'] }}

      - name: Upload final video, Remotion project, and intermediate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: promotional-video-${{ github.run_number }}
          path: ${{ steps.apvg.outputs['artifacts-path'] }}
          if-no-files-found: error
          retention-days: 14
