name: Generate promotional video

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate video on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TARGET_REPOSITORY: https://github.com/TakuKobayashi/tappunpages.git
      TARGET_URL: http://127.0.0.1:3000
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_NUM_PARALLEL: 1
      VOICEVOX_IMAGE: voicevox/voicevox_engine:cpu-ubuntu20.04-latest

    steps:
      - name: Check out video generator
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove stale generated build files
        run: pnpm clean

      - name: Install Playwright Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and download CI model
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "$OLLAMA_HOST/api/tags" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Ollama did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Start VOICEVOX Engine
        run: |
          docker run -d --rm \
            --name dvg-voicevox \
            -p 50021:50021 \
            "$VOICEVOX_IMAGE"
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "VOICEVOX Engine did not become ready" >&2
              docker logs dvg-voicevox
              exit 1
            fi
            sleep 2
          done

      - name: Create CI configuration for the fixed target repository
        run: |
          pnpm dvg project init \
            --repo "$TARGET_REPOSITORY" \
            --url "$TARGET_URL" \
            --type demo \
            --force
          sed -i "s/model: qwen2.5:7b-instruct/model: $OLLAMA_MODEL/" dvg.config.yaml

      - name: Verify generation environment
        run: node --import tsx scripts/doctor.ts

      - name: Generate promotional video
        run: pnpm dvg video generate

      - name: Upload final video and intermediate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: promotional-video-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Collect service logs after failure
        if: failure()
        run: |
          docker logs dvg-voicevox > voicevox.log 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: video-generation-diagnostics-${{ github.run_number }}
          path: |
            .dvg/
            dvg.config.yaml
            ollama.log
            voicevox.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
