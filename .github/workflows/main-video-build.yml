name: Main branch video build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-video-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Build source and generate repository video
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MODEL: qwen2.5:7b-instruct
      VOICEVOX_IMAGE: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      APVG_WORK_DIR: ./.apvg-main-build

    steps:
      - name: Check out main branch source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current source
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          "$FFMPEG_PATH" -version | head -1
          "$FFPROBE_PATH" -version | head -1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS "$OLLAMA_HOST/api/tags" >/dev/null && exit 0
            if [ "$attempt" -eq 60 ]; then
              echo "Ollama did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Download CI model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Initialize this repository as the recording target
        run: |
          pnpm apvg project init \
            --source "$GITHUB_WORKSPACE" \
            --type demo \
            --force

      - name: Configure CI model and output
        env:
          APVG_CONFIG: ./apvg.config.yml
          APVG_MODEL: ${{ env.OLLAMA_MODEL }}
          APVG_WORK_DIR: ./.apvg-main-build
          APVG_OUTPUT_DIR: ./main-video-output
          APVG_PACKAGE_ROOT: ${{ github.workspace }}
        run: node .github/automation/configure-ci-apvg.mjs

      - name: Analyze current repository
        run: pnpm apvg project analyze

      - name: Read analyzed project type
        id: analyzed-project
        run: node .github/automation/export-analyzed-project.mjs

      - name: Validate Unity license credentials
        if: steps.analyzed-project.outputs.platform == 'unity'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          [[ -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]] || {
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD secrets are required for Unity recording"
            exit 1
          }

      - name: Set up Unity Editor
        if: steps.analyzed-project.outputs.platform == 'unity'
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: ${{ steps.analyzed-project.outputs.unity-version-file }}
          build-targets: StandaloneLinux64

      - name: Activate Unity Personal license
        if: steps.analyzed-project.outputs.platform == 'unity'
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Start Unity virtual display
        if: steps.analyzed-project.outputs.platform == 'unity'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb x11-utils libgl1-mesa-dri libglu1-mesa
          Xvfb :99 -screen 0 1920x1080x24 > .apvg-main-build/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && exit 0
            if [ "$attempt" -eq 30 ]; then
              cat .apvg-main-build/xvfb.log >&2
              echo "Unity virtual display did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Verify Unity recording environment
        if: steps.analyzed-project.outputs.platform == 'unity'
        run: |
          [[ -x "$UNITY_EDITOR_PATH" ]] || {
            echo "::error::UNITY_EDITOR_PATH is not an executable file: $UNITY_EDITOR_PATH"
            exit 1
          }
          xdpyinfo -display "$DISPLAY" >/dev/null
          "$FFMPEG_PATH" -version | head -1

      - name: Generate scenario
        run: pnpm apvg video scenario generate

      - name: Release Ollama resources
        run: ollama stop "$OLLAMA_MODEL" || true

      - name: Start VOICEVOX Engine
        run: |
          docker run -d --rm \
            --name apvg-main-build-voicevox \
            -p 50021:50021 \
            "$VOICEVOX_IMAGE"
          for attempt in $(seq 1 90); do
            curl -fsS http://127.0.0.1:50021/version >/dev/null && exit 0
            if [ "$attempt" -eq 90 ]; then
              docker logs apvg-main-build-voicevox || true
              echo "VOICEVOX Engine did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Synthesize narration
        run: pnpm apvg video voice

      - name: Record interactions
        run: pnpm apvg video record

      - name: Render final video
        run: pnpm apvg video render --ffmpeg "$FFMPEG_PATH"

      - name: Export editable Remotion project
        run: pnpm apvg video export remotion

      - name: Upload generated video, Remotion project, and intermediate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: main-branch-video-${{ github.run_number }}
          path: main-video-output/
          if-no-files-found: error
          retention-days: 14

      - name: Collect failure diagnostics
        if: failure()
        run: |
          docker logs apvg-main-build-voicevox > voicevox.log 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-video-build-diagnostics-${{ github.run_number }}
          path: |
            .apvg-main-build/
            apvg.config.yml
            ollama.log
            voicevox.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Stop managed services
        if: always()
        run: |
          docker rm -f apvg-main-build-voicevox >/dev/null 2>&1 || true
          ollama stop "$OLLAMA_MODEL" >/dev/null 2>&1 || true
